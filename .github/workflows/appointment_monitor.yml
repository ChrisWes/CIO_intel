name: CIO/CDIO Appointment Monitor

on:
  schedule:
    - cron: '0 6 * * 1'   # 06:00 UTC every Monday
  workflow_dispatch:        # allows manual run from the Actions tab

permissions:
  contents: write           # needed to commit the updated baseline and digest back

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create directories
        run: mkdir -p data output logs

      - name: Run appointment monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_API_KEY:      ${{ secrets.NEWS_API_KEY }}
        run: python appointment_monitor.py

      - name: Commit updated baseline and digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/appointments_baseline.db output/
          git diff --staged --quiet || git commit -m "Appointment monitor run $(date -I)"
          git push
